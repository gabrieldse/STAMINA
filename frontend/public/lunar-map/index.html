<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>South Pole Temperatures</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #0e1014; --panel: rgba(22, 25, 31, 0.92); --border: #2c313b; --field: #1a1e25;
    --text: #e6e8eb; --muted: #9aa1ab; --accent: #00e5ff; --select: #39ff8a; --on: #3a4252;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  #map { position: fixed; inset: 0; width: 100%; height: 100%; cursor: grab; touch-action: none; }
  #map.adding { cursor: crosshair; }
  #map.dragging { cursor: grabbing; }
  .panel { position: fixed; background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px 14px; }
  #controls { top: 12px; left: 12px; width: 300px; max-height: calc(100% - 120px); overflow-y: auto; }
  h1 { font-size: 15px; margin: 0 0 2px; font-weight: 600; }
  .sub { color: var(--muted); font-size: 11px; }
  .label { display: block; color: var(--muted); font-size: 11px; margin: 12px 0 5px;
    text-transform: uppercase; letter-spacing: 0.04em; }
  select, input[type=number] { background: var(--field); color: var(--text); border: 1px solid var(--border);
    border-radius: 5px; padding: 4px 6px; font: inherit; }
  input[type=number] { width: 64px; }
  input[type=range] { width: 100%; margin: 0; accent-color: var(--accent); }
  .row { display: flex; gap: 6px; align-items: center; }
  .check { display: flex; gap: 6px; align-items: center; font-size: 12px; margin-top: 6px; cursor: pointer; }

  /* Segmented buttons: checkboxes (seasons) and radios (statistic) styled as pills. */
  .seg { display: flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; flex: 1; }
  .seg label { flex: 1; position: relative; cursor: pointer; }
  .seg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .seg span { display: block; text-align: center; padding: 4px 2px; font-size: 12px; color: var(--muted);
    background: var(--field); border-left: 1px solid var(--border); user-select: none; }
  .seg label:first-child span { border-left: 0; }
  .seg input:checked + span { background: var(--on); color: var(--text); font-weight: 600; }
  .seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: -2px; }
  .key { display: grid; gap: 5px; }

  #colorbar { width: 100%; height: 10px; border-radius: 3px; display: block; margin-top: 8px; }
  .ticks { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px;
    font-variant-numeric: tabular-nums; }
  .slider { display: grid; grid-template-columns: 30px 1fr 50px; gap: 6px; align-items: center;
    font-size: 11px; color: var(--muted); }
  .slider output { text-align: right; color: var(--text); font-variant-numeric: tabular-nums; }

  .section { border-top: 1px solid var(--border); margin-top: 12px; }
  .cond { border: 1px solid var(--border); border-radius: 6px; padding: 7px; margin-top: 7px; display: grid; gap: 5px; }
  /* Dual-handle range: two overlapping range inputs, only their thumbs take the pointer. */
  .range-head { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
  .range-head output { color: var(--text); font-variant-numeric: tabular-nums; }
  .dual { position: relative; height: 20px; }
  .dual .track, .dual .fill { position: absolute; top: 8px; height: 4px; border-radius: 2px; }
  .dual .track { left: 0; right: 0; background: var(--border); }
  .dual .fill { background: var(--select); }
  .dual input[type=range] { position: absolute; inset: 0; height: 20px; background: none; pointer-events: none;
    -webkit-appearance: none; appearance: none; }
  .dual input::-webkit-slider-runnable-track { background: none; }
  .dual input::-moz-range-track { background: none; }
  .dual input::-webkit-slider-thumb { -webkit-appearance: none; pointer-events: auto; width: 14px; height: 14px;
    border-radius: 50%; background: var(--select); border: 2px solid var(--bg); cursor: pointer; }
  .dual input::-moz-range-thumb { pointer-events: auto; width: 12px; height: 12px; border-radius: 50%;
    background: var(--select); border: 2px solid var(--bg); cursor: pointer; }
  .dual input:focus-visible::-webkit-slider-thumb { outline: 2px solid var(--accent); }
  .icon-btn { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 16px; padding: 0 2px; }
  .icon-btn:disabled { opacity: 0.3; cursor: default; }
  .btn { margin-top: 7px; width: 100%; background: var(--field); color: var(--text); border: 1px dashed var(--border);
    border-radius: 5px; padding: 4px; font: inherit; cursor: pointer; }
  .btn:hover { border-color: var(--select); }
  #selStats { margin-top: 7px; font-variant-numeric: tabular-nums; }
  #selStats b { color: var(--select); }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; background: var(--select);
    vertical-align: -1px; margin-right: 4px; }
  details { margin-top: 12px; border-top: 1px solid var(--border); padding-top: 8px; }
  summary { cursor: pointer; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
  .hint { color: var(--muted); font-size: 11px; margin-top: 10px; }
  .title-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  #controls.collapsed #controlsBody { display: none; }
  /* Embedded in the STAMINA app (?embed=1): narrower panels; the app shows the pinned values. */
  /* In the app the Temperature filter drives the map, so the viewer's own controls are hidden. */
  body.embed #controls { display: none; }
  body.embed #readout { min-width: 0; max-width: calc(100% - 24px); padding: 8px 10px; }
  body.embed #readout .t { font-size: 15px; }
  body.embed #pinned { display: none !important; }
  body.embed { --bg: #000; }
  /* Leave the bottom-left corner to the app's 2D/3D map switcher */
  body.embed #readout { left: 160px; }
  /* Comparing: no map switcher in the corner; the readout sits in the bottom strip */
  body.embed.comparing #readout { left: 12px; bottom: 8px; max-width: calc(100% - 300px); padding: 6px 10px; }
  body.embed.comparing #readout .t { font-size: 14px; }
  body.embed.comparing #rPos { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; }

  #readout { bottom: 12px; left: 12px; min-width: 300px; font-variant-numeric: tabular-nums; }
  #readout .t { font-size: 20px; font-weight: 600; }
  #pinned { top: 12px; right: 12px; width: 300px; display: none; font-variant-numeric: tabular-nums; }
  #pinned table { width: 100%; border-collapse: collapse; margin-top: 6px; }
  #pinned th, #pinned td { padding: 3px 0; border-top: 1px solid var(--border); text-align: right; font-weight: normal; }
  #pinned th { color: var(--muted); font-size: 11px; }
  #pinned th:first-child, #pinned td:first-child { text-align: left; color: var(--muted); }
  #pinned .close { float: right; }
  #status { position: fixed; inset: 0; display: grid; place-items: center; color: var(--muted); pointer-events: none; }
  @media (max-width: 640px) {
    #controls { width: calc(100% - 24px); max-height: 45%; }
    #readout { min-width: 0; right: 12px; }
    #pinned { top: auto; bottom: 110px; left: 12px; right: 12px; width: auto; }
  }
</style>
</head>
<body>
<canvas id="map"></canvas>
<div id="status">Loading…</div>

<div class="panel" id="controls">
  <div class="title-row">
    <h1>South pole temperatures</h1>
    <button class="icon-btn" id="collapse" aria-expanded="true" aria-controls="controlsBody" title="Collapse controls">▴</button>
  </div>
  <div id="controlsBody">
  <div class="sub" id="source"></div>

  <label class="check"><input type="checkbox" id="tempOn" checked>Temperature layer (off: plain Moon, LOLA relief)</label>
  <span class="label">Layer</span>
  <div class="key" id="layerKey"></div>
  <canvas id="colorbar" width="256" height="1"></canvas>
  <div class="ticks"><span id="tmin"></span><span id="tmid"></span><span id="tmax"></span></div>

  <span class="label">Ice stability threshold</span>
  <div class="slider"><span>&lt;</span><input type="range" id="threshold" min="40" max="200" step="5"
    aria-label="Ice stability threshold"><output id="thresholdValue"></output></div>
  <label class="check"><input type="checkbox" id="outline" checked>Outline colder areas (cyan)</label>

  <div class="section">
    <span class="label">Selection by interval</span>
    <label class="check"><input type="checkbox" id="selOn"><span class="swatch"></span>Highlight pixels inside the intervals</label>
    <div id="selBox" style="display:none">
      <div class="row" style="margin-top:7px">
        <div class="seg" id="selOp">
          <label><input type="radio" name="selOp" value="and" checked><span>AND all</span></label>
          <label><input type="radio" name="selOp" value="or"><span>OR any</span></label>
        </div>
      </div>
      <div id="conditions"></div>
      <button class="btn" id="addCond">+ Add condition</button>
      <label class="check"><input type="checkbox" id="selOnly">Hide everything outside the selection</label>
      <div id="selStats"></div>
    </div>
  </div>

  <details>
    <summary>Display</summary>
    <span class="label">Color range</span>
    <div class="row">
      <select id="rangeMode" style="flex:1">
        <option value="fixed">Shared 20–320 K</option>
        <option value="layer">This layer (0.1–99.9%)</option>
        <option value="custom">Custom</option>
      </select>
    </div>
    <div class="row" id="customRange" style="display:none; margin-top:6px">
      <input type="number" id="vmin" value="20" step="5"> to <input type="number" id="vmax" value="320" step="5"> K
    </div>
    <label class="check"><input type="checkbox" id="grid" checked>Latitude / longitude grid</label>
    <label class="check"><input type="checkbox" id="labels" checked>Crater names</label>
  </details>

  <div class="hint">Scroll to zoom, drag to pan, click a point to compare all layers, double-click to reset.</div>
  </div>
</div>

<div class="panel" id="readout">
  <div class="t" id="rT">–</div>
  <div id="rPos" style="color:var(--muted)">Move the mouse over the map</div>
</div>

<div class="panel" id="pinned">
  <button class="icon-btn close" id="unpin" aria-label="Close">×</button>
  <strong>Pinned point</strong>
  <div id="pPos" style="color:var(--muted)"></div>
  <table id="pTable"></table>
</div>

<script>
const $ = (id) => document.getElementById(id);
const canvas = $("map"), ctx = canvas.getContext("2d");
const SEASONS = [["summer", "Summer"], ["winter", "Winter"]];
const STATS = [["avg", "Avg"], ["min", "Min"], ["max", "Max"], ["amplitude", "Amplitude"]];
const RANGE_MIN = 0, RANGE_MAX = 450;  // kelvin, interval slider limits
const EMBED = new URLSearchParams(location.search).has("embed");
document.body.classList.toggle("embed", EMBED);
let meta, pinned = null;
const grids = {};       // id -> Uint16Array (kelvin * scale, 0 = no data)
const statsCache = {};  // id -> [p0.1, p99.9]
// A layer is a set of seasons plus a statistic; both seasons together give the annual layer.
const current = { seasons: ["summer"], stat: "max" };
// Interval selection: each condition keeps pixels with lo <= layer value <= hi (kelvin).
const conditions = [];
let selMask = null;
const image = document.createElement("canvas"), maskImage = document.createElement("canvas");
const view = { x: 0, y: 0, k: 1 };  // centre in metres, pixels per metre
// Screen rectangle the view is drawn into: the whole canvas, or one cell of the comparison grid.
const frame = { x: 0, y: 0, w: 0, h: 0 };
function useFullFrame() {
  frame.x = 0; frame.y = 0; frame.w = canvas.width; frame.h = canvas.height;
}
// Comparison grid sent by the app: { siteIds, halfSizeM, insetRight }, or null.
let compare = null;
let compareCells = [];  // last drawn cells: { x, y, w, h, site, k }, for hover and clicks
// Named landing sites sent by the STAMINA app: { id, name, color, x, y } in metres.
let appSites = [];
// In the app, clicking empty map only adds a point after "+ Add point"; on its own the viewer always pins.
let addMode = !EMBED;
function setAddMode(on) {
  addMode = on;
  canvas.classList.toggle("adding", EMBED && on);
}
// Plain Moon base map from LOLA: hillshade (uint8) and elevation (int16 m, -32768 = no data).
let base = null;
let terrainOverlayEnabled = false, terrainContours = null;
// Fallback when the contour tiles (lola_2d/build_terrain_tiles.py) aren't generated:
// marching squares over the elevation grid, sampled to at most ~1024 cells across
// so the 2048 px grid doesn't stall the page.
function buildTerrainContours() {
  if (!base || terrainContours) return;
  const minor = new Path2D(), major = new Path2D(), n = meta.size, k = Math.max(1, Math.round(n / 1024));
  for (let row=0; row<n-k; row+=k) for (let col=0; col<n-k; col+=k) {
    const i=row*n+col, h=[base.elev[i],base.elev[i+k],base.elev[i+k*n+k],base.elev[i+k*n]];
    if (h.includes(-32768)) continue;
    const corners=[[col+.5,row+.5],[col+k+.5,row+.5],[col+k+.5,row+k+.5],[col+.5,row+k+.5]];
    for (let level=Math.ceil(Math.min(...h)/500)*500; level<Math.max(...h); level+=500) {
      const points=[];
      for (let a=0; a<4; a++) {
        const b=(a+1)%4;
        if ((h[a]>level)===(h[b]>level)) continue;
        const t=(level-h[a])/(h[b]-h[a]);
        points.push([corners[a][0]+t*(corners[b][0]-corners[a][0]),corners[a][1]+t*(corners[b][1]-corners[a][1])]);
      }
      const path=level%1000===0 ? major : minor;
      // Resolve saddle cells consistently using the cell-centre elevation.
      if (points.length===4 && (h.reduce((a,b)=>a+b,0)/4>level)!==(h[0]>level)) points.push(points.shift());
      for (let p=0; p+1<points.length; p+=2) {
        path.moveTo(...points[p]); path.lineTo(...points[p+1]);
      }
    }
  }
  terrainContours={minor,major};
}
function drawTerrainContours(c,rpx) {
  if (!terrainOverlayEnabled) return;
  if (contourMeta) return drawTiles("contours", contourMeta, c, rpx);
  if (!terrainContours) return;
  const scale=2*rpx/meta.size;
  ctx.save(); ctx.translate(c.sx-rpx,c.sy-rpx); ctx.scale(scale,scale);
  ctx.strokeStyle="rgba(0,0,0,.65)"; ctx.lineWidth=3*dpr()/scale;
  ctx.stroke(terrainContours.major);
  ctx.strokeStyle="rgba(108,239,224,.65)"; ctx.lineWidth=.7*dpr()/scale;
  ctx.stroke(terrainContours.minor);
  ctx.strokeStyle="#adfff1"; ctx.lineWidth=1.3*dpr()/scale;
  ctx.stroke(terrainContours.major); ctx.restore();
}
let visibilityMask = null, visibilityConfig = null;
function applyVisibilityMask(config) {
  if (config?.encoding === "bitset-msb") {
    const packed = atob(config.visiblePacked), count = config.size*config.size;
    const visible = new Uint8Array(count);
    for (let i=0; i<count; i++) visible[i] = (packed.charCodeAt(i >> 3) >> (7-(i & 7))) & 1;
    config = { ...config, visible };
  }
  visibilityConfig = config;
  visibilityMask = null;
  if (config && !config.pending) {
    const image = document.createElement("canvas");
    image.width = image.height = config.size;
    const context = image.getContext("2d"), pixels = context.createImageData(config.size, config.size);
    for (let i=0; i<config.visible.length; i++) {
      // Opaque black removes obstructed areas, keeping only matching terrain.
      if (!config.visible[i]) pixels.data[i*4+3] = 255;
    }
    context.putImageData(pixels, 0, 0);
    visibilityMask = image;
  }
  draw();
}
function matchesVisibility(x, y) {
  if (!visibilityConfig) return true;
  if (visibilityConfig.pending) return false;
  const n = visibilityConfig.size;
  const col = Math.floor((x/meta.radiusM+1)*n/2);
  const row = Math.floor((1-y/meta.radiusM)*n/2);
  return col >= 0 && row >= 0 && col < n && row < n && visibilityConfig.visible[row*n+col] === 1;
}
let terrainMeta = null, contourMeta = null;
const terrainTiles = new Map();
// kind: "terrain" (shaded relief) or "contours" (transparent contour lines)
function tileImage(kind, z, x, y) {
  const key = `${kind}/${z}/${x}/${y}`;
  if (terrainTiles.has(key)) {
    const tile = terrainTiles.get(key);
    terrainTiles.delete(key); terrainTiles.set(key, tile);
    return tile;
  }
  const tile = new Image();
  terrainTiles.set(key, tile);
  tile.onload = () => requestAnimationFrame(draw);
  tile.onerror = () => { tile.failed = true; };
  tile.src = `data/${key}.png`;
  // Bound decoded image memory during long pan/zoom sessions.
  if (terrainTiles.size > 384) terrainTiles.delete(terrainTiles.keys().next().value);
  return tile;
}
function drawTerrain(c, rpx) {
  if (!terrainMeta || showTemperature()) return;
  drawTiles("terrain", terrainMeta, c, rpx);
}
// Draws the tiles of one pyramid that cover the current frame (whole map or a comparison cell).
function drawTiles(kind, info, c, rpx) {
  const z = Math.min(info.maxZoom, Math.max(0, Math.ceil(Math.log2(2*rpx / info.tileSize))));
  const count = 2**z, span = 2*rpx/count;
  const left = c.sx-rpx, top = c.sy-rpx;
  const x0 = Math.max(0, Math.floor((frame.x-left)/span)), x1 = Math.min(count-1, Math.floor((frame.x+frame.w-left)/span));
  const y0 = Math.max(0, Math.floor((frame.y-top)/span)), y1 = Math.min(count-1, Math.floor((frame.y+frame.h-top)/span));
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";
  for (let y=y0; y<=y1; y++) for (let x=x0; x<=x1; x++) {
    const tile = tileImage(kind,z,x,y);
    if (tile.complete && tile.naturalWidth) ctx.drawImage(tile,left+x*span,top+y*span,span+.25,span+.25);
    else {
      // Keep a lower level visible while the detailed tile loads.
      for (let parent=z-1; parent>=0; parent--) {
        const factor=2**(z-parent), px=Math.floor(x/factor), py=Math.floor(y/factor);
        const fallback=tileImage(kind,parent,px,py), part=info.tileSize/factor;
        if (fallback.complete && fallback.naturalWidth) {
          ctx.drawImage(fallback,(x%factor)*part,(y%factor)*part,part,part,left+x*span,top+y*span,span+.25,span+.25);
          break;
        }
      }
    }
  }
}
// Colour range of the temperature image, shown as a legend next to the scale bar (null = plain Moon).
let legend = null;
const showTemperature = () => $("tempOn").checked;

// ---------- geometry: south polar stereographic, sphere R ----------
function toLatLon(x, y) {
  const r = Math.hypot(x, y);
  const colat = 2 * Math.atan(r / (2 * meta.moonRadiusM));
  return { lat: -90 + colat * 180 / Math.PI, lon: Math.atan2(x, y) * 180 / Math.PI };
}
function toXY(lat, lon) {
  const r = 2 * meta.moonRadiusM * Math.tan((90 + lat) * Math.PI / 360);
  const a = lon * Math.PI / 180;
  return { x: r * Math.sin(a), y: r * Math.cos(a) };
}
const dpr = () => window.devicePixelRatio || 1;
const toScreen = (x, y) => ({ sx: frame.x + frame.w / 2 + (x - view.x) * view.k, sy: frame.y + frame.h / 2 - (y - view.y) * view.k });
const toWorld = (sx, sy) => ({ x: view.x + (sx - frame.x - frame.w / 2) / view.k, y: view.y - (sy - frame.y - frame.h / 2) / view.k });
function pixelIndex(x, y) {
  const px = 2 * meta.radiusM / meta.size;
  const col = Math.floor((x + meta.radiusM) / px), row = Math.floor((meta.radiusM - y) / px);
  if (col < 0 || row < 0 || col >= meta.size || row >= meta.size || Math.hypot(x, y) > meta.radiusM) return -1;
  return row * meta.size + col;
}

// ---------- layers ----------
const isAnnual = (key) => key.seasons.length === 2;
const keyId = (key) => `${isAnnual(key) ? "annual" : key.seasons[0]}_${key.stat}`;
function keyName(key) {
  const season = isAnnual(key) ? "Annual" : SEASONS.find(([s]) => s === key.seasons[0])[1];
  return `${season} ${STATS.find(([s]) => s === key.stat)[1].toLowerCase()}`;
}

async function fetchGrid(id) {
  if (!grids[id]) grids[id] = new Uint16Array(await (await fetch(`data/${id}.bin`)).arrayBuffer());
  return grids[id];
}
// Annual layers combine the two seasons: max of maxima, min of minima, mean of averages,
// and amplitude = annual max - annual min.
async function getGrid(key) {
  const id = keyId(key);
  if (grids[id]) return grids[id];
  if (!isAnnual(key)) return fetchGrid(id);
  let out;
  if (key.stat === "amplitude") {
    const [hi, lo] = await Promise.all([getGrid({ ...key, stat: "max" }), getGrid({ ...key, stat: "min" })]);
    out = hi.map((h, i) => (h && lo[i] ? Math.max(1, h - lo[i]) : 0));
  } else {
    const [s, w] = await Promise.all(["summer", "winter"].map((season) => fetchGrid(`${season}_${key.stat}`)));
    const f = { max: Math.max, min: Math.min, avg: (a, b) => Math.round((a + b) / 2) }[key.stat];
    out = s.map((a, i) => (!a ? w[i] : !w[i] ? a : f(a, w[i])));
  }
  return (grids[id] = out);
}
function percentiles(id) {
  if (!statsCache[id]) {
    const single = meta.layers.find((l) => l.id === id);
    if (single) statsCache[id] = [single.p01, single.p999];
    else {
      const sample = [];
      for (let i = 0; i < grids[id].length; i += 7) if (grids[id][i]) sample.push(grids[id][i] / meta.scale);
      sample.sort((a, b) => a - b);
      statsCache[id] = [sample[Math.floor(sample.length * 0.001)], sample[Math.floor(sample.length * 0.999)]];
    }
  }
  return statsCache[id];
}
function valueAt(grid, x, y) {
  const i = pixelIndex(x, y);
  if (i < 0 || !grid[i]) return null;
  return grid[i] / meta.scale;
}

// Season checkboxes + statistic radios, shared by the main layer and each condition.
const seasonPills = (prefix, key) => `<div class="seg" data-part="seasons">${SEASONS.map(([v, l]) =>
  `<label><input type="radio" name="${prefix}-season" value="${v}"${key.seasons.includes(v) ? " checked" : ""}><span>${l}</span></label>`).join("")}</div>`;
const statPills = (prefix, key) => `<div class="seg" data-part="stat">${STATS.map(([v, l]) =>
  `<label><input type="radio" name="${prefix}-stat" value="${v}"${key.stat === v ? " checked" : ""}><span>${l}</span></label>`).join("")}</div>`;
function bindKeyControls(el, key, onChange) {

  $("pTable").innerHTML = rows.join("") + `<tr><td colspan="4" style="color:var(--muted);font-size:11px">kelvin</td></tr>`;
  draw();
}

// ---------- interval selection ----------
function addCondition() {
  const key = { seasons: [...current.seasons], stat: current.stat };
  const [lo, hi] = percentiles(keyId(key));
  conditions.push({ ...key, lo: Math.floor(lo), hi: Math.ceil(hi) });
  renderConditions();
  updateSelection();
}
function renderConditions() {
  $("conditions").innerHTML = conditions.map((c, i) => `
    <div class="cond" data-i="${i}">
      <div class="row">${seasonPills(`c${i}`, c)}<button class="icon-btn c-remove" aria-label="Remove condition"${conditions.length === 1 ? " disabled" : ""}>×</button></div>
      ${statPills(`c${i}`, c)}
      <div class="range-head"><span>Interval</span><output class="c-range">${c.lo}–${c.hi} K</output></div>
      <div class="dual">
        <div class="track"></div><div class="fill"></div>
        <input type="range" class="c-lo" min="${RANGE_MIN}" max="${RANGE_MAX}" step="1" value="${c.lo}" aria-label="Minimum temperature">
        <input type="range" class="c-hi" min="${RANGE_MIN}" max="${RANGE_MAX}" step="1" value="${c.hi}" aria-label="Maximum temperature">
      </div>
    </div>`).join("");
  document.querySelectorAll(".cond").forEach((el) => {
    const c = conditions[+el.dataset.i];
    bindKeyControls(el, c, updateSelection);
    el.querySelector(".c-remove").onclick = () => { conditions.splice(+el.dataset.i, 1); renderConditions(); updateSelection(); };
    const lo = el.querySelector(".c-lo"), hi = el.querySelector(".c-hi"), fill = el.querySelector(".fill");
    const paint = () => {
      const pct = (v) => (100 * (v - RANGE_MIN)) / (RANGE_MAX - RANGE_MIN);
      fill.style.left = `${pct(c.lo)}%`;
      fill.style.width = `${pct(c.hi) - pct(c.lo)}%`;
      el.querySelector(".c-range").textContent = `${c.lo}–${c.hi} K`;
      // When the handles meet at the top, keep the min handle reachable.
      lo.style.zIndex = c.lo > (RANGE_MIN + RANGE_MAX) / 2 ? 2 : 1;
    };
    const onSlide = (moved) => {
      // The handles can't cross: the dragged one stops at the other.
      if (+lo.value > +hi.value) moved.value = moved === lo ? hi.value : lo.value;
      c.lo = +lo.value; c.hi = +hi.value;
      paint();
      scheduleSelection();
    };
    lo.oninput = () => onSlide(lo);
    hi.oninput = () => onSlide(hi);
    paint();
  });
}

let selectionQueued = false;
function scheduleSelection() {
  if (selectionQueued) return;
  selectionQueued = true;
  requestAnimationFrame(() => { selectionQueued = false; updateSelection(); });
}
async function updateSelection() {
  if (!showTemperature() || !$("selOn").checked || conditions.length === 0) {
    selMask = null; $("selStats").textContent = ""; draw();
    postToApp({ type: "stamina:selection-stats", stats: null });
    return;
  }
  const layerGrids = await Promise.all(conditions.map(getGrid));
  const n = meta.size, N = n * n, hideOutside = $("selOnly").checked;
  const and = document.querySelector('input[name="selOp"]:checked').value === "and";
  const bounds = conditions.map((c) => [c.lo * meta.scale, c.hi * meta.scale]);
  selMask = new Uint8Array(N);
  maskImage.width = maskImage.height = n;
  const mctx = maskImage.getContext("2d"), img = mctx.createImageData(n, n), d = img.data;
  let inside = 0, valid = 0;
  for (let i = 0; i < N; i++) {
    let ok = and, hasData = false;
    for (let k = 0; k < layerGrids.length; k++) {
      const v = layerGrids[k][i];
      if (v !== 0) hasData = true;
      const hit = v !== 0 && v >= bounds[k][0] && v <= bounds[k][1];
      ok = and ? ok && hit : ok || hit;
    }
    if (!hasData) continue;
    valid++;
    if (ok) {
      selMask[i] = 1; inside++;
      // Tint the selection; lighter when the rest is hidden, so the base colors still show.
      d[4 * i] = 57; d[4 * i + 1] = 255; d[4 * i + 2] = 138; d[4 * i + 3] = hideOutside ? 90 : 150;
    } else if (hideOutside) {
      d[4 * i] = 14; d[4 * i + 1] = 16; d[4 * i + 2] = 20; d[4 * i + 3] = 235;
    }
  }
  mctx.putImageData(img, 0, 0);
  const pxKm = 2 * meta.radiusM / meta.size / 1000;
  $("selStats").innerHTML = `<span class="swatch"></span><b>${(inside * pxKm * pxKm).toLocaleString("en", { maximumFractionDigits: 0 })} km²</b>` +
    ` selected · ${valid ? (100 * inside / valid).toFixed(1) : 0}% of the cap`;
  postToApp({ type: "stamina:selection-stats",
              stats: { areaKm2: inside * pxKm * pxKm, percentOfCap: valid ? (100 * inside) / valid : 0 } });
  draw();
}

// ---------- STAMINA app integration (?embed=1) ----------
function postToApp(message) {
  if (EMBED && window.parent !== window) window.parent.postMessage(message, window.location.origin);
}
// The app's Temperature filter: layer, ice threshold, and a selection that keeps pixels
// whose layer value AND seasonal amplitude are inside the given ranges.
async function applyAppConfig(config) {
  $("tempOn").checked = config.enabled;
  current.seasons = [config.season];
  current.stat = config.statistic;
  $("threshold").value = config.iceStabilityThresholdK;
  $("thresholdValue").textContent = `${config.iceStabilityThresholdK} K`;
  $("selOn").checked = config.selectionEnabled;
  conditions.length = 0;
  conditions.push(
    { seasons: [config.season], stat: config.statistic, lo: config.temperatureK.min, hi: config.temperatureK.max },
    { seasons: [config.season], stat: "amplitude", lo: config.amplitudeK.min, hi: config.amplitudeK.max },
  );
  await showCurrentLayer();
  await updateSelection();
}
window.addEventListener("message", (event) => {
  if (!EMBED || event.origin !== window.location.origin) return;
  const data = event.data;
  if (data?.type === "stamina:terrain-overlay") {
    terrainOverlayEnabled = data.enabled === true;
    if (terrainOverlayEnabled && !contourMeta) buildTerrainContours();
    draw();
  }
  if (data?.type === "stamina:visibility-mask") applyVisibilityMask(data.config);
  if (data?.type === "stamina:temperature-config") applyAppConfig(data.config);
  if (data?.type === "stamina:sites") {
    appSites = data.sites.map((site) => ({
      ...site, ...toXY(site.latitude, site.longitude),
      outline: site.region?.map(([lat, lon]) => toXY(lat, lon)),
    }));
    draw();
  }
  if (data?.type === "stamina:add-mode") setAddMode(data.enabled);
  if (data?.type === "stamina:default-view") resetView();
  // Comparison grid on/off: { siteIds, halfSizeM, insetRight } or null
  if (data?.type === "stamina:compare") {
    compare = data.compare;
    document.body.classList.toggle("comparing", Boolean(compare));
    draw();
  }
  // Eye button in the app: centre on the site and zoom in to show ~80 km around it.
  if (data?.type === "stamina:center-on") {
    const site = appSites.find((item) => item.id === data.siteId);
    if (site) {
      view.x = site.x; view.y = site.y;
      view.k = Math.max(view.k, 0.45 * Math.min(canvas.width, canvas.height) / 40000);
      draw();
    }
  }
  if (data?.type === "stamina:focus-site") {
    const site = appSites.find((item) => item.id === data.siteId);
    if (site) pin(site.x, site.y, site.id);
    else { pinned = null; draw(); }
  }
});

// ---------- interaction ----------
function resize() {
  canvas.width = canvas.clientWidth * dpr();
  canvas.height = canvas.clientHeight * dpr();
  if (meta) draw();
}
function resetView() {
  // Centre the map in the free space to the right of the controls panel.
  const panel = $("controls").getBoundingClientRect();
  const left = panel.right * dpr(), freeW = canvas.width - left;
  view.k = 0.45 * Math.min(freeW, canvas.height) / meta.radiusM;
  view.x = -((left + canvas.width) / 2 - canvas.width / 2) / view.k;
  view.y = 0;
  draw();
}

let drag = null;
canvas.addEventListener("pointerdown", (e) => {
  if (compare) { drag = { moved: false }; return; }  // cells don't pan; clicks select
  drag = { sx: e.offsetX, sy: e.offsetY, vx: view.x, vy: view.y, moved: false };
  canvas.setPointerCapture(e.pointerId); canvas.classList.add("dragging");
});
canvas.addEventListener("pointermove", (e) => {
  if (drag && !compare) {
    const dx = e.offsetX - drag.sx, dy = e.offsetY - drag.sy;
    if (Math.hypot(dx, dy) > 3) drag.moved = true;
    view.x = drag.vx - dx * dpr() / view.k; view.y = drag.vy + dy * dpr() / view.k;
    draw();
  }
  readoutAt(e);
});
canvas.addEventListener("pointerup", (e) => {
  canvas.classList.remove("dragging");
  if (drag && !drag.moved && compare) {
    // A click in a comparison cell selects its site.
    inCompareCell(e.offsetX * dpr(), e.offsetY * dpr(), (cell) => pin(cell.site.x, cell.site.y, cell.site.id));
  } else if (drag && !drag.moved) {
    const w = toWorld(e.offsetX * dpr(), e.offsetY * dpr());
    // A click on a landing site marker selects that site.
    const site = siteNear(e.offsetX * dpr(), e.offsetY * dpr());
    if (site) pin(site.x, site.y, site.id);
    else if (addMode && Math.hypot(w.x, w.y) <= meta.radiusM) {
      pin(w.x, w.y);
      if (EMBED) setAddMode(false);  // one point per "+ Add point"
    }
  }
  drag = null;
});
canvas.addEventListener("wheel", (e) => {
  e.preventDefault();
  if (compare) return;  // the crop size comes from the app
  const before = toWorld(e.offsetX * dpr(), e.offsetY * dpr());
  const maxK = 40 * meta.size / (2 * meta.radiusM);  // up to 40 screen px per data pixel
  view.k = Math.min(maxK, Math.max(0.2 * canvas.height / meta.radiusM / 2, view.k * Math.exp(-e.deltaY * 0.0015)));
  const after = toWorld(e.offsetX * dpr(), e.offsetY * dpr());
  view.x += before.x - after.x; view.y += before.y - after.y;
  draw(); updateReadout(e);
}, { passive: false });
canvas.addEventListener("dblclick", () => { if (!compare) resetView(); });
$("collapse").onclick = () => {
  const collapsed = $("controls").classList.toggle("collapsed");
  $("collapse").textContent = collapsed ? "▾" : "▴";
  $("collapse").setAttribute("aria-expanded", String(!collapsed));
  $("collapse").title = collapsed ? "Expand controls" : "Collapse controls";
};
$("unpin").onclick = () => { pinned = null; $("pinned").style.display = "none"; draw(); };

async function showCurrentLayer() {
  $("status").textContent = "Loading…"; $("status").style.display = "grid";
  await getGrid(current);
  $("status").style.display = "none";
  buildImage();
}
$("rangeMode").onchange = () => {
  $("customRange").style.display = $("rangeMode").value === "custom" ? "flex" : "none";
  buildImage();
};
for (const id of ["vmin", "vmax", "outline"]) $(id).onchange = buildImage;
$("tempOn").onchange = () => { buildImage(); updateSelection(); };
$("threshold").oninput = () => { $("thresholdValue").textContent = `${$("threshold").value} K`; buildImage(); };
for (const id of ["grid", "labels"]) $(id).onchange = draw;
$("selOn").onchange = () => {
  $("selBox").style.display = $("selOn").checked ? "block" : "none";
  if ($("selOn").checked && conditions.length === 0) addCondition(); else updateSelection();
};
$("addCond").onclick = addCondition;
document.querySelectorAll('input[name="selOp"]').forEach((i) => (i.onchange = updateSelection));
$("selOnly").onchange = updateSelection;
window.addEventListener("resize", resize);
// Esc cancels "+ Add point" (keys typed in the map don't reach the app)
window.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && EMBED && addMode) {
    setAddMode(false);
    postToApp({ type: "stamina:add-mode", enabled: false });
  }
});

(async function init() {
  try {
    meta = await (await fetch("data/meta.json")).json();
  } catch {
    $("status").textContent = "No map data yet: run `uv run lola_2d/diviner_web.py --no-serve` from the repository root.";
    return;
  }
  $("source").textContent = `${meta.source} · ${(2 * meta.radiusM / meta.size).toFixed(0)} m/px`;
  $("layerKey").innerHTML = seasonPills("main", current) + statPills("main", current);
  bindKeyControls($("layerKey"), current, showCurrentLayer);
  $("threshold").value = meta.iceThresholdK;
  $("thresholdValue").textContent = `${meta.iceThresholdK} K`;
  if (meta.base) {
    const [shade, elev] = await Promise.all([meta.base.hillshade, meta.base.elevation]
      .map(async (file) => (await fetch(`data/${file}`)).arrayBuffer()));
    base = { shade: new Uint8Array(shade), elev: new Int16Array(elev) };
  }
  // Inside the app the plain Moon is the default; the app turns temperature on.
  // Inside the app each layer gets its own colour range, so the legend follows Avg/Min/Max/Amplitude.
  if (EMBED) { $("tempOn").checked = false; $("rangeMode").value = "layer"; }
  resize(); resetView();
  await showCurrentLayer();
  // Contour tiles for the terrain overlay (optional; without them the overlay is computed in
  // the browser). Read before telling the app the map is ready, which then sends the overlay state.
  contourMeta = await fetch("data/contours/meta.json")
    .then((response) => (response.ok ? response.json() : null))
    .catch(() => null);
  fetch("data/terrain/meta.json").then(response => {
    if (!response.ok) throw new Error("Terrain tiles not generated");
    return response.json();
  }).then(info => {
    terrainMeta = info;
    $("source").textContent += ` · Terrain: ${info.source}, ${info.resolutionM} m/px`;
    draw();
  }).catch(() => {}); // The original base map remains usable without optional tiles.
  postToApp({ type: "stamina:viewer-ready" });
})();
</script>
